[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbharat"
version = "0.1.0"
description = "LexBharat: AI legal research with verified citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "redis",
    "arq",
    "qdrant-client",
    "httpx",
    "litellm",
    "typesafe-sdk>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "fastembed",  # the A136 evidence scripts (c_sparse.py) and any BM25 re-encode; was only in `search` and `data`
    # F10 proof only. The masking and scrubbing are built (A182) but NOT wired: no
    # runtime code imports either vendor, and the tripwire tests in tests/security/
    # fail if one is wired before the proof passes. These are dev-only on purpose —
    # promote them to a runtime dependency in the same change that adds the two call
    # sites, not before. A version bump should re-run the hostile-document proof,
    # which was measured against sentry-sdk 2.73.0 and langfuse 5.1.0.
    "sentry-sdk",
    "langfuse",
]
search = [
    "fastembed",  # keyword (BM25) half of hybrid search; needed by the API image
]
data = [
    "duckdb",
    "pyarrow",
    "fastembed",
    "numpy",
]

[tool.setuptools]
packages = ["api", "core", "adapters", "workers", "data"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"data/**" = ["S101", "E501"]
# Read-only report script: its long lines are prose in the generated report.
"scan/**" = ["E501"]
# The A136 evidence scripts (DECISIONS A136): a loopback read of the original, a seeded sample.
"evals/a136/**" = ["S101", "E501", "S310", "S311"]
# The A141 cost-picture measurements: long prose docstrings, a loopback read of the copy instance.
"evals/a141/**" = ["E501"]
# The labelling-pack scripts: long prose docstrings, a loopback read of the copy instance.
"evals/labelling/**" = ["E501"]
# The latency measurement (CLAUDE.md section 10): long prose docstrings, a loopback read of the copy instance.
"evals/performance/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
