[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexbharat"
version = "0.1.0"
description = "LexBharat: AI legal research with verified citations"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "redis",
    "arq",
    "qdrant-client",
    "httpx",
    "litellm",
    "typesafe-sdk>=0.7,<0.8",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "fastembed",  # the A136 evidence scripts (c_sparse.py) and any BM25 re-encode; was only in `search` and `data`
]
search = [
    "fastembed",  # keyword (BM25) half of hybrid search; needed by the API image
]
data = [
    "duckdb",
    "pyarrow",
    "fastembed",
    "numpy",
]

[tool.setuptools]
packages = ["api", "core", "adapters", "workers", "data"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]
"data/**" = ["S101", "E501", "S310", "S311"]
# Operational read-only scripts, like data/: long report lines, a loopback-URL read,
# a seeded sample and `df`/`diskutil` calls are what they are for.
"scan/**" = ["S101", "E501", "S310", "S311", "S607", "S608"]
# The A136 evidence scripts (DECISIONS A136): a loopback read of the original, a seeded sample.
"evals/a136/**" = ["S101", "E501", "S310", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
