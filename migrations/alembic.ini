# Alembic config. Run from the repo root:
#   alembic -c migrations/alembic.ini upgrade head
# The database URL is NOT here: env.py reads DATABASE_URL through core.settings (rule 2).
[alembic]
script_location = %(here)s
# Put migrations/ (for our helper module) and the repo root (for core.settings)
# on sys.path before Alembic imports anything.
prepend_sys_path = %(here)s:%(here)s/..
path_separator = os
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
