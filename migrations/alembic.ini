# Run from the repo root:  alembic -c migrations/alembic.ini upgrade head
# (inside Docker, ALEMBIC_CONFIG points here so plain `alembic upgrade head` works).
[alembic]
script_location = migrations
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
