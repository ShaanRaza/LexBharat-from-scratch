# Dependency updates. Required by the Tech Stack's security rules.
#
# Only ecosystems whose manifest actually exists may be listed: Dependabot
# ERRORS on a missing manifest, it does not quietly find nothing. Uncomment
# each block as the build step that creates its manifest lands.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # pyproject.toml exists (build step 2), so this is on.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Uncomment at build step 4, once web/package.json exists:
  # - package-ecosystem: npm
  #   directory: /web
  #   schedule:
  #     interval: weekly
  #   open-pull-requests-limit: 5

  # infra/ now holds a Dockerfile, so this is on.
  - package-ecosystem: docker
    directory: /infra
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
