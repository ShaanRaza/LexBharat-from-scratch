name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Docs and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No .env committed
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git. Secrets must never be committed."
            exit 1
          fi
          echo "No .env in the index."

      - name: Markdown links resolve
        run: python3 .github/scripts/check_links.py

  python:
    name: Python
    runs-on: ubuntu-latest
    # A real, throw-away PostgreSQL so the migration tests and the database-store tests
    # run for real (they are skipped, not failed, when this is absent).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kanoon
          POSTGRES_PASSWORD: kanoon
          POSTGRES_DB: kanoon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanoon -d kanoon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Must end in _test: the tests drop and rebuild this database's tables.
      TEST_DATABASE_URL: postgresql+psycopg://kanoon:kanoon@localhost:5432/kanoon_test
    steps:
      - uses: actions/checkout@v4

      - name: Is there Python to check?
        id: detect
        run: |
          if [ -f pyproject.toml ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No pyproject.toml yet — skipping. This job starts working at build step 2."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.found == 'true'
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: pip install -e ".[dev]"

      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Tests
        if: steps.detect.outputs.found == 'true'
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is there a web app to check?
        id: detect
        run: |
          if [ -f web/package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No web/package.json yet — skipping. This job starts working at build step 4."
          fi

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: npm ci

      - name: Lint and typecheck
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build
        if: steps.detect.outputs.found == 'true'
        working-directory: web
        run: npm run build
